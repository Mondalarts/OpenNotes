<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newton Lite Smart Manager</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
 font-family: system-ui;
 background: linear-gradient(135deg,#0f172a,#1e1b4b);
 color:white;
 margin:0;
 padding-bottom:110px;
 min-height:100vh;
}
.glass{
 background:rgba(255,255,255,.08);
 backdrop-filter:blur(14px);
 border:1px solid rgba(255,255,255,.15);
 border-radius:22px;
}
.nav-item{opacity:.45;cursor:pointer;font-size:11px}
.nav-item.active{opacity:1;color:#60a5fa}
.hidden-page{display:none}
.btn:active{transform:scale(.95)}
</style>
</head>

<body>

<header class="p-5 glass sticky top-0 flex justify-between items-center mb-2">
<div>
<div class="font-bold text-xl">Newton Lite</div>
<div id="date" class="text-xs opacity-50"></div>
</div>
<div class="text-green-400 font-bold text-lg">₹<span id="bal"></span></div>
</header>

<main class="p-5 space-y-6 max-w-md mx-auto">

<!-- HOME -->
<div id="home" class="space-y-6">

<div class="glass p-5">
<div class="text-xs opacity-60 mb-3 uppercase tracking-wide">Today Routine</div>
<div id="todayClass" class="text-sm space-y-2 leading-relaxed"></div>
</div>

<div class="grid grid-cols-2 gap-4">

<div class="glass p-5">
<div class="text-xs opacity-60 mb-1">Today Spend</div>
<div class="text-2xl font-bold">₹<span id="todaySpend"></span></div>
</div>

<div class="glass p-5">
<div class="text-xs opacity-60 mb-1">Safe Limit</div>
<div class="text-2xl font-bold text-blue-400">₹<span id="safe"></span></div>
</div>

</div>

<button onclick="changeWeekly()" class="glass p-5 w-full btn text-sm">
Weekly Budget ₹<span id="weeklyDisplay"></span>
</button>

<div id="alerts" class="space-y-3"></div>

</div>

<!-- WALLET -->
<div id="expense" class="hidden-page space-y-5">

<div class="grid grid-cols-2 gap-4">
<button onclick="addExp(10,'Travel')" class="glass p-5 btn">+10 Travel</button>
<button onclick="addExp(20,'Food')" class="glass p-5 btn">+20 Food</button>
<button onclick="addExp(50,'Food')" class="glass p-5 btn">+50 Food</button>
<button onclick="addExp(30,'Other')" class="glass p-5 btn">+30 Other</button>
</div>

<div id="hist" class="space-y-3"></div>

</div>

<!-- TUITION -->
<div id="tuition" class="hidden-page space-y-5">
<button onclick="addTuition()" class="glass p-5 w-full btn">
➕ Add Tuition
</button>
<div id="tuitionList" class="space-y-4"></div>
</div>

<!-- REPORT -->
<div id="report" class="hidden-page space-y-5">
<div id="reportBox" class="glass p-6 space-y-2"></div>
<button onclick="copyReport()" class="glass p-5 w-full btn">
Copy Report
</button>
</div>

</main>

<nav class="fixed bottom-0 left-0 right-0 glass m-5 p-4 flex justify-around">
<div id="btn-home" class="nav-item active" onclick="navTo('home')">Home</div>
<div id="btn-expense" class="nav-item" onclick="navTo('expense')">Wallet</div>
<div id="btn-tuition" class="nav-item" onclick="navTo('tuition')">Study</div>
<div id="btn-report" class="nav-item" onclick="navTo('report')">Stats</div>
</nav>

<script>

/* ===== ROUTINE ===== */

const routine={
0:[["Bengali","Manash","7:30 AM"],["English","Partha","9:45 AM"]],
1:[["Math","Raihan","7:30 AM"],["Biology","Raj","7 PM"]],
2:[["Physics","Shibai","11 AM"],["Geography","Kiran","4 PM"],["History","Sujata","7 PM"]],
3:[["Bengali","Manash","7:30 PM"]],
4:[["History","Sujata","12 PM"],["English","Partha","5:30 PM"]],
5:[["Math","Raihan","7:30 AM"],["Physics","Shibai","11 AM"]],
6:[["Biology","Raj","11 AM"],["Geography","Kiran","4 PM"]]
};

/* ===== STATE ===== */

let state = JSON.parse(localStorage.getItem("nlite_final")) || {
weeklyBudget:500,
balance:500,
expenses:[],
paid:[],
tuitions:[
{id:1,n:"Math",t:"Raihan",f:500},
{id:2,n:"Biology",t:"Raj",f:400}
],
week:0
};

/* ===== NAV ===== */

function navTo(id){
["home","expense","tuition","report"].forEach(p=>{
document.getElementById(p).classList.add("hidden-page")
});
document.getElementById(id).classList.remove("hidden-page");
document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
document.getElementById("btn-"+id).classList.add("active");
render();
}

/* ===== EXPENSE ===== */

function addExp(a,c){
if(state.balance<a && !confirm("Low balance — add anyway?")) return;
state.balance-=a;
state.expenses.unshift({
a,c,
d:new Date().toDateString(),
t:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
});
save();
}

/* ===== BUDGET ===== */

function changeWeekly(){
let v=prompt("New weekly budget?",state.weeklyBudget);
if(!v || isNaN(v)) return;
state.weeklyBudget=+v;
if(confirm("Reset wallet now?")) state.balance=+v;
save();
}

/* ===== TUITION ===== */

function addTuition(){
let n=prompt("Subject?"); if(!n) return;
let t=prompt("Teacher?");
let f=+prompt("Fee?"); if(isNaN(f)) return;
state.tuitions.push({id:Date.now(),n,t,f});
save();
}

function editTuition(id){
let x=state.tuitions.find(a=>a.id==id);
let nn=prompt("Subject",x.n);
let tt=prompt("Teacher",x.t);
let ff=prompt("Fee",x.f);
if(nn) x.n=nn;
if(tt) x.t=tt;
if(ff && !isNaN(ff)) x.f=+ff;
save();
}

function deleteTuition(id){
if(!confirm("Delete?")) return;
state.tuitions=state.tuitions.filter(x=>x.id!=id);
state.paid=state.paid.filter(p=>!p.startsWith(id+"-"));
save();
}

function toggleFee(id){
let m=new Date().getMonth(),y=new Date().getFullYear();
let k=id+"-"+m+"-"+y;
let i=state.paid.indexOf(k);
i>-1?state.paid.splice(i,1):state.paid.push(k);
save();
}

/* ===== MATH ===== */

const sumCat=c=>state.expenses.filter(x=>x.c==c).reduce((s,x)=>s+x.a,0);
const totalSpent=()=>state.expenses.reduce((s,x)=>s+x.a,0);

function safeDaily(){
let d=new Date().getDay()||7;
let left=Math.max(1,7-d+1);
return Math.floor(state.balance/left);
}

function mostCat(){
if(!state.expenses.length) return "None";
return ["Food","Travel","Other"]
.sort((a,b)=>sumCat(b)-sumCat(a))[0];
}

function predictedWeek(){
let d=new Date().getDay()||7;
return Math.round(totalSpent()/d*7);
}

/* ===== WEEK RESET ===== */

function weekNo(){
let d=new Date();
d.setDate(d.getDate()+4-(d.getDay()||7));
return Math.ceil(((d-new Date(d.getFullYear(),0,1))/864e5+1)/7);
}

if(state.week!=weekNo()){
state.week=weekNo();
state.balance=state.weeklyBudget;
state.expenses=[];
}

/* ===== SYSTEM ===== */

function save(){
localStorage.setItem("nlite_final",JSON.stringify(state));
render();
}

function copyReport(){
let txt=`Newton Lite Report
Balance ₹${state.balance}
Spent ₹${totalSpent()}
Top ${mostCat()}
Predicted ₹${predictedWeek()}`;
navigator.clipboard.writeText(txt);
alert("Copied");
}

/* ===== RENDER ===== */

function render(){

date.innerText=new Date().toDateString();
bal.innerText=state.balance;
weeklyDisplay.innerText=state.weeklyBudget;

/* routine */
let d=new Date().getDay();
todayClass.innerHTML=(routine[d]||[])
.map(x=>`${x[0]} (${x[1]}) — ${x[2]}`).join("<br>")||"No class";

/* spend */
let ts=state.expenses.filter(x=>x.d==new Date().toDateString())
.reduce((s,x)=>s+x.a,0);
todaySpend.innerText=ts;
safe.innerText=safeDaily();

/* alerts */
alerts.innerHTML="";
if(ts>safeDaily())
alerts.innerHTML+=`<div class="glass p-3 text-xs">Daily limit crossed</div>`;
if(predictedWeek()>state.weeklyBudget)
alerts.innerHTML+=`<div class="glass p-3 text-xs">Weekly overspend trend</div>`;

/* history */
hist.innerHTML=state.expenses.slice(0,6)
.map(x=>`<div class="glass p-4 flex justify-between">
${x.c}<span class="text-red-400">₹${x.a}</span>
</div>`).join("") || `<div class="opacity-30 text-xs">No history</div>`;

/* tuition */
let m=new Date().getMonth(),y=new Date().getFullYear();
tuitionList.innerHTML=state.tuitions.map(t=>{
let p=state.paid.includes(t.id+"-"+m+"-"+y);
return `<div class="glass p-4 space-y-2">
<div class="flex justify-between">
<div>${t.n}<br><span class="text-xs opacity-50">${t.t} • ₹${t.f}</span></div>
<button onclick="toggleFee(${t.id})"
class="px-3 py-1 rounded ${p?'bg-green-600':'bg-red-600'}">
${p?'Paid':'Due'}
</button>
</div>
<div class="flex gap-2">
<button onclick="editTuition(${t.id})" class="glass p-2 flex-1 text-xs">Edit</button>
<button onclick="deleteTuition(${t.id})" class="bg-red-800/40 p-2 rounded flex-1 text-xs">Delete</button>
</div>
</div>`
}).join("");

/* report */
reportBox.innerHTML=`
<div class="text-xl font-bold">₹${totalSpent()}</div>
<div class="text-xs opacity-50 mb-2">This Week</div>
Food ₹${sumCat("Food")}<br>
Travel ₹${sumCat("Travel")}<br>
Other ₹${sumCat("Other")}<br>
Top ${mostCat()}<br>
Predicted ₹${predictedWeek()}
`;
}

render();

</script>
</body>
</html>
